[project]
name = "vlc-mcp"
version = "0.1.0"
description = "MCP server that lets an AI assistant control and curate music in VLC for Android (music mode fork) over its Remote Access API"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2", "httpx>=0.27"]

[project.scripts]
vlc-mcp = "vlc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlc_mcp"]

[dependency-groups]
dev = ["pytest>=8"]
